# preflight CI — minimal GitHub Actions, by deliberate cost design.
#
# preflight is CTR infrastructure, and Actions bills by OS multiplier (Linux 1x,
# Windows 2x, macOS 10x), rounding each job up to the whole minute. So the
# EXPENSIVE per-PR validation moved OFF Actions onto local compute: the required
# `ctr/preflight-ci` check runs the full smoke + tarball-install + gate-manifest
# determinism suite on Windows (Git-Bash) AND Linux (the Playwright Docker image)
# locally, and `ctr/cross-model-review` runs the cross-model review. Both are
# required by the branch-protection ruleset and posted by the local runners.
#
# What stays on Actions, and why:
#   - smoke (ubuntu)  — runs on every PR + push to main. Linux is the 1x lane, so
#     this is ~1 billed minute. It is an ADVISORY in-repo CI signal (NOT a
#     required check — the local ctr/preflight-ci is the enforcement), kept so
#     the per-PR build/smoke boundary stays auditable in the repo itself rather
#     than living entirely in cross-repo config.
#   - build-only (macos) — runs on version tags ONLY. macOS (10x) is the one
#     platform with no local runtime, so it validates the compile + tarball shape
#     at release time, where the rare 10-billed-minute cost is justified.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  smoke:
    # PRs + main pushes only (skipped on tag pushes — that's the macOS lane).
    name: smoke (ubuntu)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install + build
        run: |
          npm ci
          npm run build

      - name: Pack tarball
        id: pack
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed: $tarball"

      - name: Set up scratch dir + install packed tarball
        shell: bash
        run: |
          mkdir -p _ci_scratch
          cp ci/preflight.smoke.config.ts _ci_scratch/preflight.config.ts
          cp -r ci/fixture _ci_scratch/fixture
          cd _ci_scratch
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-save \
            "../${{ steps.pack.outputs.tarball }}" \
            @playwright/test@^1.50.0 \
            http-server@^14.1.1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pack.outputs.tarball }}

      - name: Install Chromium browser
        shell: bash
        working-directory: _ci_scratch
        run: npx playwright install chromium

      - name: Run preflight --smoke
        shell: bash
        working-directory: _ci_scratch
        run: npx preflight --smoke --ci

      - name: Upload last-run artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-last-run-ubuntu
          path: _ci_scratch/.preflight/last-run/
          retention-days: 7

  build-only:
    # Version tags only — the macOS (10x) compile/tarball validation at release.
    name: build-only (macos)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm pack --silent
